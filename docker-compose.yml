name: ankicollab-dev

services:
  db:
    image: postgres:18
    restart: unless-stopped

    # schema-database.sql uses pg_stat_statements.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - search_path=anki,public

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/schema-database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    ports:
      - "5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10


  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped

    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"

      # Local development credentials.
      # These come from .env.docker.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

    volumes:
      - rustfs_data:/data

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9000/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # Creates the application bucket once RustFS is ready.
  rustfs-init:
    image: amazon/aws-cli:latest
    restart: "no"

    depends_on:
      rustfs:
        condition: service_healthy

    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: eu-central-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eu

        echo "Checking S3 bucket: $$S3_BUCKET_NAME"

        if aws --endpoint-url http://rustfs:9000 \
          s3api head-bucket \
          --bucket "$$S3_BUCKET_NAME" >/dev/null 2>&1; then
          echo "Bucket already exists: $$S3_BUCKET_NAME"
        else
          echo "Creating bucket: $$S3_BUCKET_NAME"

          aws --endpoint-url http://rustfs:9000 \
            s3api create-bucket \
            --bucket "$$S3_BUCKET_NAME"

          echo "Bucket created: $$S3_BUCKET_NAME"
        fi

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.docker
    
    volumes:
      - ./.env.docker:/app/.env:ro

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}

      # RustFS is reachable under this hostname from other Compose services.
      S3_DOMAIN: http://rustfs:9000

      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      BIND_ADDRESS: 0.0.0.0:5555

    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  website:
    build:
      context: ./website
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.docker

    volumes:
      - ./.env.docker:/app/.env:ro

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}

      S3_DOMAIN: http://rustfs:9000

      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_MEDIA_BUCKET: ${S3_BUCKET_NAME}

      BIND_ADDRESS: 0.0.0.0:1337

    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "80:80"

    depends_on:
      - backend
      - website
      - rustfs


volumes:
  pgdata:
  rustfs_data: